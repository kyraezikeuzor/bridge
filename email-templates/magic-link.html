<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

  <body

      padding: 0;
      background-color: #f5f5f5;
      font-family: Helvetica, Arial, sans-serif;

        max-height: 0;
        overflow: hidden;
        mso-hide: all;
        font-size: 1px;
        line-height: 1px;

    <table

      cellpadding="0"

      border="0"
      width="100%"

          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"

              border-radius: 16px;
              border: 1px solid #e5e5e5;
            "
          >
            <tr>
              <td
                align="center"
                style="padding: 48px 40px 40px 40px"
              >
                <!-- Logo -->
                <table

                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"

                          height: 64px;

                          border-radius: 14px;

                  </tr>
                </table>

                <!-- Heading -->
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"

                >
                  <tr>
                    <td
                      align="center"
                      style="
                        padding-bottom: 12px;
                        font-family: Helvetica, Arial, sans-serif;
                        font-size: 28px;
                        line-height: 1.3;
                        font-weight: 700;
                        color: #1f1f1f;
                      "
                    >
                      Sign in to Bridge
                    </td>
                  </tr>
                </table>

                <!-- Body -->
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        padding-bottom: 32px;
                        font-family: Helvetica, Arial, sans-serif;
                        font-size: 16px;
                        line-height: 1.5;
                        color: #666666;
                      "

                      Click the link below to sign in

                  </tr>
                </table>

                <!-- Button -->
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#FF971E"
                      style="
                        background-color: #ff971e;
                        border-radius: 10px;
                        mso-padding-alt: 14px 32px;
                      "
                    >
                      <!--[if mso]>
                        <v:roundrect
                          xmlns:v="urn:schemas-microsoft-com:vml"

                      <!--[if !mso]><!-- -->
                      <a

                          font-size: 16px;
                          font-weight: 700;
                          line-height: 1.25;
                          text-align: center;
                          text-decoration: none;
                          padding: 14px 36px;
                          border-radius: 10px;
                          mso-hide: all;

                  </tr>

                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"

                    <td

                        border-top: 1px solid #e5e5e5;
                        font-size: 0;
                        line-height: 0;
                        height: 1px;
